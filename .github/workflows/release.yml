name: Release

# Publishes the Windows client and the package `install.sh` downloads.
#
# Tag a commit `v0.2.0` and push the tag. Two jobs run, in this order:
#
#   windows-client  builds FFmpeg, then the client, then an installer
#   package         puts that installer in the `.deb` and builds the `.deb`
#
# **The order is the point.** `tools/package.sh` puts whatever is in
# `dist/client` into `/usr/share/openvideoserver/client`, which is where
# `crates/ovs-core/src/server/downloads.rs` looks when somebody opens the
# server's download page. The evening that page exists for is the one where
# somebody needs the client on a second laptop and the venue's wifi is a
# captive portal — so the installer has to be inside the package, not beside
# it. Build the package first and it ships with nothing to offer.
#
# What comes out is a `.deb`, the `.sha256` beside it, and the Windows
# installer — which is exactly what the installer script looks for:
#
#   https://api.github.com/repos/<owner>/<repo>/releases/latest
#     -> browser_download_url ending openvideoserver_<version>_<arch>.deb
#     -> the same name with .sha256 appended
#
# Change either half of that shape and the installer stops finding it.
#
# # What it publishes is not a GPL build
#
# The package carries the FFmpeg `tools/build-ffmpeg.sh --profile server`
# makes, rather than depending on Debian's, which is GPL-2.0-or-later. NOTICE
# says what that means for anybody redistributing it. `tools/package.sh`
# refuses to build a package whose binaries reach the system's FFmpeg, so this
# cannot quietly stop being true — but it is written here because this is the
# file somebody opens on the way to a first public tag.

on:
  push:
    tags: ['v*']
  # Buildable by hand, so the packaging can be proved before a tag exists.
  workflow_dispatch:

permissions:
  contents: write

env:
  # **The commit, told rather than asked for.** `ovs-types`' build script reads
  # it from git, and git in a container often refuses a checkout it does not own
  # — which would quietly make every published build say `unknown`, and that
  # constant exists precisely so nobody has to guess which build they installed.
  OVS_BUILD_COMMIT: ${{ github.sha }}
  # **The Debian revision**, the part of a version after the hyphen. `dpkg`
  # orders by it, so a new build is an upgrade rather than a reinstall — and
  # two packages that are different software stop being called the same thing.
  # The run number because it is monotonic, already here, and nobody has to
  # remember to bump it.
  OVS_PACKAGE_REVISION: ${{ github.run_number }}

jobs:
  windows-client:
    # Windows, because this produces a Windows installer and because the
    # `client` FFmpeg profile is the Windows one: MediaFoundation, QuickSync
    # and AMF are in its configure line and none of them cross-compiles from
    # the Debian container the package is built in.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # **FFmpeg is built here rather than taken from npm.** `ffmpeg-static`
      # declares GPL-3.0-or-later and its binary reports `--enable-gpl
      # --enable-version3`, measured on 2026-09-27 by running this
      # repository's own licence check over it. Publishing that inside an
      # Apache-2.0 client is a licence breach; NOTICE has always said the
      # client's FFmpeg is the one `tools/build-ffmpeg.sh` makes, and this is
      # what makes that true rather than aspirational.
      #
      # MSYS2 because FFmpeg's build system is autotools and this repository's
      # build script is POSIX shell. `--profile client` configures it
      # `--disable-gpl --disable-nonfree --disable-version3` and checks the
      # finished binary rather than its own command line.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # `nasm` because a build without an assembler decodes several times
          # slower and the script refuses it. Snappy is what HAP needs, and HAP
          # is the whole reason it is worth having. The header-only packages
          # are the hardware encoders the client prefers over software.
          install: >-
            base-devel
            git
            curl
            diffutils
            make
            tar
            xz
            nasm
            pkgconf
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-snappy
            mingw-w64-x86_64-ffnvcodec-headers
            mingw-w64-x86_64-amf-headers
            mingw-w64-x86_64-libvpl

      - name: Build the FFmpeg that may be shipped
        shell: msys2 {0}
        run: ./tools/build-ffmpeg.sh --profile client

      # Separately from the build that produced it, because what matters is
      # what came out: the check reads `ffmpeg -version` and fails on
      # `--enable-gpl`, `--enable-version3` or `--enable-nonfree`, on a missing
      # licence text, and on any decoder an operator's files need being absent.
      - name: Check it is one that may be shipped
        shell: msys2 {0}
        run: ./tools/build-ffmpeg.sh --check clients/desktop/vendor/ffmpeg

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # `--release` refuses to fall back to the npm FFmpeg. Belt and braces
      # with the check above: that one proves the vendored build is clean, and
      # this one proves the vendored build is the one that got packaged.
      # `extraMetadata.version` puts the revision in the installer's filename
      # *and* in what the running client reports, which is the version the
      # server sees in the handshake. One flag, both places.
      - name: Build the installer
        shell: bash
        run: |
          upstream=$(node -p "require('./clients/desktop/package.json').version")
          npm run client:dist:win -- \
            --config.extraMetadata.version="$upstream-$OVS_PACKAGE_REVISION"

      - name: Say what it is called
        shell: bash
        run: ls -l build/client/*.exe

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-client
          path: build/client/*.exe
          if-no-files-found: error

  package:
    needs: windows-client
    runs-on: ubuntu-latest

    # **Debian, not the Ubuntu runner.** `dpkg-shlibdeps` reads the binaries and
    # asks the local dpkg which package owns each library, so a package built on
    # Ubuntu 24.04 declares `libavcodec60` and one built on Debian trixie
    # declares `libavcodec61`. Built on the runner, the published package would
    # be uninstallable on the operating system it is for, and the error would
    # arrive at the person running the installer rather than here.
    container: debian:trixie

    steps:
      # Before the checkout, because the container has neither git nor curl and
      # `actions/checkout` wants git.
      - name: Install what the job itself needs
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential pkg-config \
            dpkg-dev fakeroot \
            nasm libopenh264-dev zlib1g-dev \
            libclang-dev
          # **What Chromium names.** Not to run it — nothing here starts a
          # browser — but because `dpkg-shlibdeps` answers "which package owns
          # this library" by asking the local dpkg, and can only name a
          # dependency for a library that is installed. Without these it names
          # none, and the package installs a System screen onto a minimal
          # Debian with nothing to load it. `tools/package.sh` refuses to build
          # such a package; this is what stops it having to.
          #
          # Each name checked against Debian's archive for trixie before it was
          # written here: several carry the `t64` suffix from the 64-bit time_t
          # transition, and guessing between `libasound2` and `libasound2t64`
          # costs a whole run.
          apt-get install -y --no-install-recommends \
            libnss3 libnspr4 \
            libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 \
            libcups2t64 libdrm2 libgbm1 libxkbcommon0 \
            libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxrandr2 libxshmfence1 \
            libasound2t64 libpango-1.0-0 libcairo2 \
            libexpat1 libdbus-1-3 libglib2.0-0t64
        # **No libav*-dev.** The package builds its own FFmpeg, so Debian's is
        # not needed — and leaving it off makes this job a proof rather than a
        # hope: anything that tried to link the system's FFmpeg fails here,
        # instead of producing a package whose licence is wrong in a way only
        # somebody reading `dpkg-deb -f` would ever notice.
        #
        # `nasm` because a build without an assembler decodes several times
        # slower and `tools/build-ffmpeg.sh` refuses it; `libopenh264-dev` and
        # `zlib1g-dev` are the two external libraries that build enables.

      - uses: actions/checkout@v4

      # Into `dist/client`, which is the one place `tools/package.sh` looks.
      - name: Take the Windows installer from the job before
        uses: actions/download-artifact@v4
        with:
          name: windows-client
          path: dist/client

      - name: Say what the package will carry
        run: ls -l dist/client/

      - name: Install the pinned toolchain
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # `rustup show` reads rust-toolchain.toml and installs what it names, so
      # the release is built with the same compiler as everything else.
      - name: Resolve the toolchain
        run: rustup show

      # **The Chromium the System screen draws with.** `tools/package.sh`
      # refuses to build a package without it, and rightly: the package installs
      # a System screen, and one that cannot start is worse than one that is not
      # there.
      #
      # The version is read out of the manifest rather than written here.
      # `export-cef-dir` decides which distribution to fetch from *its own*
      # version, so the newest one fetches a CEF that bindings pinned at
      # 154.0.0 do not describe — and a binding set that does not match the
      # library it calls is how CEF aborts inside `CefInitialize` with nothing
      # in the log. This repository has paid for that once already; see the
      # comment on the pin in `crates/ovs-console/Cargo.toml`.
      - name: Read the CEF pin out of the manifest
        id: cef
        run: |
          version=$(sed -n 's/^cef = .*"=\([0-9.]*\)".*/\1/p' crates/ovs-console/Cargo.toml)
          test -n "$version" || { echo "no cef pin found in crates/ovs-console/Cargo.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "the cef crate is pinned at $version"

      # It is 1.5 GB, and it changes only when that pin does.
      - name: Cache the distribution
        id: cef-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cef
          key: cef-${{ steps.cef.outputs.version }}

      - name: Fetch the distribution
        if: steps.cef-cache.outputs.cache-hit != 'true'
        run: |
          cargo install export-cef-dir --version "=${{ steps.cef.outputs.version }}"
          export-cef-dir -f ~/.local/share/cef

      - name: Build the package
        run: ./tools/package.sh

      - name: Say what came out
        run: |
          ls -l target/package/
          dpkg-deb --info target/package/*.deb

      # Kept whether or not this was a tag, so a `workflow_dispatch` run is
      # useful on its own.
      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: |
            target/package/*.deb
            target/package/*.sha256

      - name: Publish it
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # The Windows installer goes up beside the package as well as inside
          # it. Inside is for the evening with no internet; beside is for
          # everybody who has not installed a server yet and has nothing to
          # download it from.
          files: |
            target/package/*.deb
            target/package/*.sha256
            dist/client/*.exe
          generate_release_notes: true
