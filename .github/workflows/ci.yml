name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # **The commit, told rather than asked for.** `ovs-types`' build script reads
  # it from git, and git in a container often refuses a checkout it does not own
  # — which would quietly make every build here say `unknown`, and that constant
  # exists precisely so nobody has to guess which build they are holding.
  OVS_BUILD_COMMIT: ${{ github.sha }}
  # The renderer is realtime infrastructure; a warning here is a defect later.
  RUSTFLAGS: -D warnings

jobs:
  rust:
    # Debian is the production target, so the primary job runs on Linux even
    # though development happens on Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # **Room for what this builds.** A debug build of this workspace is 13 GB,
      # and `ovs-console` fetches a 1.5 GB Chromium on top of it; a runner
      # starts with about 21 GB. It filled, and so completely that the runner
      # could not write its own diagnostic log — which is why that failure
      # arrived as a job with no output at all rather than as an error.
      #
      # None of what is removed here is anything this repository uses, and
      # between them they are larger than the whole build.
      - name: Make room
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      # `ovs-renderer` and `ovs-media` link FFmpeg under `cfg(unix)`, and the
      # bindings need libclang for bindgen. None of it is
      # compiled on the Windows job, so this is the only place the linkage is
      # exercised — and until now the workflow was relying on whatever the
      # runner image happened to carry, which is a dependency nobody declared.
      - name: Install what the Unix build links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libclang-dev

      - name: Install the pinned toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

      # What it cost, so that the next time this fills there is a number to
      # compare against rather than a job that produced nothing.
      - name: Say what is left
        if: always()
        run: |
          df -h / | tail -1
          du -sh target 2>/dev/null || true

      # The golden schema test above already fails on drift. This runs the
      # generator so a failure shows the actual diff rather than only the name
      # of the file that changed.
      - name: Show schema drift, if any
        if: failure()
        run: |
          cargo run -p ovs-proto --bin ovs-schema-gen -- schemas
          git --no-pager diff --stat schemas/
          git --no-pager diff schemas/

  typescript:
    # The contract and the client that is built against it. Node 22 because the
    # client's tests use `Response` and `URL` as the platform provides them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Nothing here runs Electron, and downloading a hundred megabytes of it
      # would only be a slower way to reach the same result.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Check the generated TypeScript matches the committed schemas
        run: npm run schema:check

      - name: Type-check the desktop client
        run: npm run client:typecheck

      # Electron is not installed here and is not needed: everything this runs
      # is the client's own reasoning, with the socket, the clock and `fetch`
      # handed in. The suite that needs a real server names one and is skipped
      # when nothing does.
      - name: Test the desktop client
        run: npm run client:test

  windows-build:
    # Development happens on Windows, so it must keep compiling there.
    #
    # The first time this ever ran — 2026-09-27, on the first push to GitHub —
    # it did not: `ovs-renderer` used `std::os::fd` and `libc` in four places
    # with no `cfg` gate, and called a `cfg(unix)` function unconditionally.
    # None of it can run on Windows and all of it had to compile there, which
    # is the whole point of this job and exactly what nothing was checking.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # **Without `ovs-console`.** It links CEF, which is a gigabyte of
      # distribution that has to be fetched and pinned to the crate's exact
      # version — and the thing it builds is a browser window on a DRM
      # connector, which is a Debian rack display and nothing a Windows machine
      # has. Fetching CEF here to prove a Linux-only crate still compiles for a
      # platform it never runs on is a long download for no answer.
      - run: cargo test --workspace --exclude ovs-console

  package:
    # A server is installed from the `.deb`, so a break in the packaging is a
    # break in the product. Found here rather than on a tag, when the only way
    # out is another tag.
    #
    # In the same Debian container the release uses: `dpkg-shlibdeps` reads the
    # binaries and asks the local dpkg which package owns each library, so this
    # job proves what the release will actually produce rather than an Ubuntu
    # flavoured approximation of it.
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install what the job itself needs
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential pkg-config \
            dpkg-dev fakeroot \
            nasm libopenh264-dev zlib1g-dev \
            libclang-dev
          # **What Chromium names.** Not to run it — nothing here starts a
          # browser — but because `dpkg-shlibdeps` answers "which package owns
          # this library" by asking the local dpkg, and can only name a
          # dependency for a library that is installed. Without these it names
          # none, and the package installs a System screen onto a minimal
          # Debian with nothing to load it. `tools/package.sh` refuses to build
          # such a package; this is what stops it having to.
          #
          # Each name checked against Debian's archive for trixie before it was
          # written here: several carry the `t64` suffix from the 64-bit time_t
          # transition, and guessing between `libasound2` and `libasound2t64`
          # costs a whole run.
          apt-get install -y --no-install-recommends \
            libnss3 libnspr4 \
            libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 \
            libcups2t64 libdrm2 libgbm1 libxkbcommon0 \
            libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 \
            libxfixes3 libxrandr2 libxshmfence1 \
            libasound2t64 libpango-1.0-0 libcairo2 \
            libexpat1 libdbus-1-3 libglib2.0-0t64
        # **No libav*-dev.** The package builds its own FFmpeg, so Debian's is
        # not needed — and leaving it off makes this job a proof rather than a
        # hope: anything that tried to link the system's FFmpeg fails here,
        # instead of producing a package whose licence is wrong in a way only
        # somebody reading `dpkg-deb -f` would ever notice.
        #
        # `nasm` because a build without an assembler decodes several times
        # slower and `tools/build-ffmpeg.sh` refuses it; `libopenh264-dev` and
        # `zlib1g-dev` are the two external libraries that build enables.

      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Resolve the toolchain
        run: rustup show

      # **The Chromium the System screen draws with.** `tools/package.sh`
      # refuses to build a package without it, and rightly: the package installs
      # a System screen, and one that cannot start is worse than one that is not
      # there.
      #
      # The version is read out of the manifest rather than written here.
      # `export-cef-dir` decides which distribution to fetch from *its own*
      # version, so the newest one fetches a CEF that bindings pinned at
      # 154.0.0 do not describe — and a binding set that does not match the
      # library it calls is how CEF aborts inside `CefInitialize` with nothing
      # in the log. This repository has paid for that once already; see the
      # comment on the pin in `crates/ovs-console/Cargo.toml`.
      - name: Read the CEF pin out of the manifest
        id: cef
        run: |
          version=$(sed -n 's/^cef = .*"=\([0-9.]*\)".*/\1/p' crates/ovs-console/Cargo.toml)
          test -n "$version" || { echo "no cef pin found in crates/ovs-console/Cargo.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "the cef crate is pinned at $version"

      # It is 1.5 GB, and it changes only when that pin does.
      - name: Cache the distribution
        id: cef-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cef
          key: cef-${{ steps.cef.outputs.version }}

      - name: Fetch the distribution
        if: steps.cef-cache.outputs.cache-hit != 'true'
        run: |
          cargo install export-cef-dir --version "=${{ steps.cef.outputs.version }}"
          export-cef-dir -f ~/.local/share/cef

      - name: Build the package
        run: ./tools/package.sh

      # The maintainer scripts run as root on somebody else's machine, and a
      # syntax error in one strands a half-unpacked install. Cheap to check.
      - name: Check the maintainer scripts parse
        run: |
          for script in deploy/debian/postinst deploy/debian/prerm deploy/debian/postrm; do
            sh -n "$script"
          done
          bash -n install.sh
          bash -n tools/package.sh

      # The installer picks the package and the Windows client out of a release
      # with a pair of greps, and a grep that matches nothing looks exactly like
      # a release that carries nothing: both leave the variable empty and the
      # script carries on politely. Run under dash, which is what a pipe into
      # `sh` gets on Debian.
      - name: Check the installer picks the right assets out of a release
        run: |
          apt-get install -y --no-install-recommends dash
          dash tools/test-release-assets.sh

      - name: Say what came out
        run: dpkg-deb --info target/package/*.deb
