# What an NVIDIA card needs before it will give up more than one output.
#
# Installed by `tools/deploy.sh` and carried by the package as a conffile, so an
# administrator's edits here survive an upgrade. **Neither reboots.** These
# modules load from the initramfs, so both rebuild it when this file changes and
# then say out loud that the running kernel is still using what it booted with.
#
# On a machine with no NVIDIA card every line here is inert: modprobe ignores
# options for a module that is not there. It is installed anyway, so a machine
# that grows a card later already has them.

# **modeset=0, and this is the line that matters.**
#
# With modesetting enabled — which is what the driver ships — the NVIDIA KMS
# driver owns the card's connectors, and `VK_KHR_display` cannot take the one it
# is asked for: `vkAcquireDrmDisplayEXT` refuses even with the process holding
# DRM master on the card. One output comes up, a second one does not, and nothing
# says why. Established by running `ovs-planes` either side of a reboot on
# 2026-09-26.
#
# The renderer reaches the connectors through `VK_KHR_display` on /dev/nvidia0
# instead, which is what the `display` backend is. With modesetting off the card
# registers no KMS device at all, so it contributes no connectors to
# /sys/class/drm — which is how to check from outside that this took effect. The
# parameter itself is root-readable only, and reads `Y` or `N`:
#
#   sudo cat /sys/module/nvidia_drm/parameters/modeset
#
# **The module name is the trap, and this file names only the one that works
# here.** Debian's packaging calls it `nvidia-current-drm` — `modprobe
# --showconfig` shows `install nvidia_drm modprobe nvidia-modeset ; modprobe -i
# nvidia-current-drm` — so `nvidia_drm` is an alias and `nvidia-current-drm` is
# the module that takes the option. That difference is why the
# `nvidia-drm.modeset=0` on the kernel command line which every forum post
# recommends reaches nothing at all on Debian, silently, and looks like it worked.
#
# Debian is the production target, so that is the spelling shipped. On a
# distribution that names the module `nvidia-drm`, add
# `options nvidia-drm modeset=0` as well — deliberately not shipped here, because
# it could not be verified on this machine and an unverified line in a boot
# configuration is worse than a note in a comment.
options nvidia-current-drm modeset=0

# **Keep video memory across suspend.** Nothing to do with outputs; it is here
# because it belongs in the same file. Without it a machine that sleeps wakes up
# with a card full of nothing, and the show it was holding is gone.
options nvidia-current NVreg_PreserveVideoMemoryAllocations=1
